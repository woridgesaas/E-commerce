image: docker:24.0.5
services:
    - docker:24.0.5-dind

stages:
    - build
    - test
    - push
    - deploy

variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
    IMAGE_TAR: image.tar

build-job:
    stage: build
    script:
        - echo "Building the new image ..."
        - docker build -t $IMAGE_NAME -f ./infra/php/Dockerfile .
        - docker save $IMAGE_NAME -o $IMAGE_TAR
    artifacts:
        paths:
            - $IMAGE_TAR
        expire_in: 1 hour

test-job:
    stage: test
    before_script:
        - docker load -i $IMAGE_TAR
    script:
        - echo "Running unit tests..."
        - docker run --rm $IMAGE_NAME php bin/phpunit --testsuite=Unit
    artifacts:
        reports:
            junit: var/log/phpunit.junit.xml
        expire_in: 30 days

push-job:
    stage: push
    before_script:
        - "docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY"
        - docker load -i $IMAGE_TAR
    script:
        - echo "pushing the image to gitlab registry with name $IMAGE_NAME"
        - docker push $IMAGE_NAME
    only:
        - main
    when: on_success
