image: docker:24.0.5
services:
    - docker:24.0.5-dind

stages:
    - build
    - test
    - push
    - deploy

variables:
    IMAGE_NAME: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

#keep docker engine alive between containers
cache:
    key: docker-cache
    paths:
        - /var/lib/docker


build-job:
    stage: build
    before_script:
        - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    script:
        - echo "Building the new image ..."
        - docker build -t $IMAGE_NAME -f ./infra/php/Dockerfile .
        - docker push $IMAGE_NAME

test-job:
    stage: test
    before_script:
        - docker pull  $IMAGE_NAME
    script:
        - echo "Running unit tests..."
        - docker run --rm $IMAGE_NAME php bin/phpunit --testsuite=Unit
    artifacts:
        reports:
            junit: var/log/phpunit.junit.xml
        expire_in: 30 days

push-job:
    stage: push
    before_script:
        - "docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY"
    script:
        - echo "pushing the image to gitlab registry with name $IMAGE_NAME"
        - docker push $IMAGE_NAME
    only:
        - main
    when: on_success
