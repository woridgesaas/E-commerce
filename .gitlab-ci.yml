image: docker:24.0.5
services:
    - docker:24.0.5-dind

stages:
    - build
    - test
    - push
    - deploy

variables:
    IMAGE_PHP: $CI_REGISTRY_IMAGE/php:$CI_COMMIT_SHA
    IMAGE_NGINX: $CI_REGISTRY_IMAGE/nginx:$CI_COMMIT_SHA
    ECR_REGISTRY: $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

#keep docker engine alive between containers
cache:
    key: docker-cache
    paths:
        - /var/lib/docker


build-job:
    stage: build
    before_script:
        - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    script:
        - echo "Building & pushing Php image to gitlab registry..."
        - docker build -t $IMAGE_PHP -f ./infra/php/Dockerfile .
        - docker push $IMAGE_PHP

        - echo "Building & pushing Nginx image to gitlab registry ..."
        - docker build -t $IMAGE_NGINX -f ./infra/nginx/Dockerfile .
        - docker push $IMAGE_NGINX

test-job:
    stage: test
    before_script:
        - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
        - docker pull $IMAGE_PHP
    script:
        - echo "Running unit tests..."
        # Installer dev deps to run tests
        - docker run --rm -v $CI_PROJECT_DIR:/app -w /app $IMAGE_NAME composer install --no-interaction
        - docker run --rm -v $CI_PROJECT_DIR:/app -w /app $IMAGE_NAME vendor/bin/phpunit --testsuite=Unit --log-junit var/log/phpunit.junit.xml
    artifacts:
        reports:
            junit: var/log/phpunit.junit.xml
        expire_in: 10 days

push-to-ecr:
    stage: push
    before_script:
        - "docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY"
        #install AWS cli to execute commands inside docker-dind alpine
        - apk add --no-cache aws-cli
        - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
    script:
        - echo "Promoting images from GitLab Registry to AWS ECR..."
        - docker pull $IMAGE_PHP
        - docker pull $IMAGE_NGINX

        - docker tag $IMAGE_PHP $ECR_REGISTRY/woridge-php:$CI_COMMIT_SHORT_SHA
        - docker tag $IMAGE_NGINX $ECR_REGISTRY/woridge-nginx:$CI_COMMIT_SHORT_SHA

        - docker push $ECR_REGISTRY/woridge-php:$CI_COMMIT_SHORT_SHA
        - docker push $ECR_REGISTRY/woridge-nginx:$CI_COMMIT_SHORT_SHA
    only:
        - main
    when: on_success
