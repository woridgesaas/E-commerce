version: '3.8'

services:
  woridge.php:
    container_name: symfony_app
    user: "1000:1000"
    build:
      context: .
      dockerfile: infra/php/Dockerfile
    volumes:
      - ./:/var/www/html:cached
    env_file:
      - .env
      - .env.local
    depends_on:
      - woridge.database
    healthcheck:
      test: ["CMD", "php", "-r", "exit(extension_loaded('pdo_mysql') ? 0 : 1);"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - mailer-network
      - woridge-global-network
      - woridge-ecomm-network
      - provisioning-service-network

  woridge.nginx:
    image: nginx:stable
    container_name: ecommerce_nginx
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./public:/var/www/html/public
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - woridge.php
    networks:
        woridge-ecomm-network:
        admin-service-network:
            aliases:
                - admin-service

  woridge.database:
    container_name: administrative_database
    image: mysql:8.0
    env_file:
      - .env
      - .env.local
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - woridge-ecomm-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: ecommerce_phpmyadmin
    ports:
      - "8088:80"
    environment:
      PMA_HOST: administrative_database
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      - woridge.database
    networks:
      - woridge-ecomm-network

  redis:
      image: redis:7.2
      container_name: woridge_redis
      networks:
          - woridge-ecomm-network
      ports:
          - "6379:6379"


volumes:
  mysql_data:

networks:
  mailer-network:
    external: true

  woridge-ecomm-network:
    external: true
  woridge-global-network:
    external: true
  admin-service-network:
    external: true

  provisioning-service-network:
      external: true

