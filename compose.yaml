services:
  woridge.php:
    container_name: symfony_app
    build:
      context: .
      dockerfile: infra/php/Dockerfile
    volumes:
      - ./:/var/www/html:cached
    env_file:
      - .env
      - .env.local
    depends_on:
      - woridge.database
    networks:
      - mailer-network
      - woridge-ecomm-network

  woridge.nginx:
    image: nginx:stable
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./public:/var/www/html/public
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - woridge.php
    networks:
      - woridge-ecomm-network

  woridge.database:
    container_name: administrative_database
    image: mysql:8.0
    env_file:
      - .env
      - .env.local
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - woridge-ecomm-network

volumes:
  mysql_data:


networks:
  mailer-network:
    external: true
  woridge-ecomm-network:
    external: true
