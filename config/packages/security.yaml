security:
    password_hashers:
        App\Infrastructure\Security\SecurityUser:
            algorithm: bcrypt

    providers:
        app_user_provider:
            id: App\Infrastructure\Security\AppUserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false


        internal_api:
            lazy: true
            stateless: true
            pattern: '^/api/internal/'
            custom_authenticators:
                - App\Infrastructure\Security\InternalApiKeyAuthenticator


        main:
            lazy: true
            provider: app_user_provider

            custom_authenticator: App\Infrastructure\Security\LoginAuthenticator

            entry_point: App\Infrastructure\Security\LoginAuthenticator
            form_login:
                 use_referer: true

            logout:
                path: app_logout
                target: app_login

    access_control:
        - { path: ^/api/internal, roles: ROLE_INTERNAL_MACHINE }
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/product, roles: PUBLIC_ACCESS }  
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password,  roles: PUBLIC_ACCESS }
        - { path: ^/test-email, roles: PUBLIC_ACCESS }
        - { path: ^/documentation, roles: PUBLIC_ACCESS }
        - { path: ^/subscriptions, roles: PUBLIC_ACCESS }

        - { path: ^/cart, roles: ROLE_USER }          
        - { path: ^/api, roles: ROLE_USER }
        - { path: ^/admin, roles: ROLE_ADMIN }
        
        
       

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
