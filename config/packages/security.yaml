security:
    password_hashers:
        App\Infrastructure\Security\SecurityUser:
            algorithm: bcrypt

    providers:
        app_user_provider:
            id: App\Infrastructure\Security\AppUserProvider

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            custom_authenticator: App\Infrastructure\Security\LoginAuthenticator

            entry_point: App\Infrastructure\Security\LoginAuthenticator
            form_login:
                 use_referer: true

            logout:
                path: app_logout
                target: app_login

    access_control:
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/product, roles: PUBLIC_ACCESS }  
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/login, roles: PUBLIC_ACCESS }

        - { path: ^/cart, roles: ROLE_USER }          
        - { path: ^/api, roles: ROLE_USER }
        - { path: ^/admin, roles: ROLE_ADMIN }

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER