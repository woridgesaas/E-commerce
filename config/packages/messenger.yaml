framework:
    messenger:
        transports:
            provisioning:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: 'provisioning_exchange'
                        type: direct
                    queues:
                        provisioning_queue: ~
                retry_strategy:
                    max_retries: 5
                    delay: 60000
                    multiplier: 2

            tenant_ready:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                serializer: messenger.transport.symfony_serializer
                options:
                    exchange:
                        name : 'woridge.exchange'
                        type: topic

            activing_account_ceo:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                serializer: messenger.transport.symfony_serializer
                options:
                    exchange:
                        name: 'activing.account'
                        type: direct



        routing:
            'App\Application\Provisioning\Command\ProvisioningCommand': provisioning
            'App\Application\Provisioning\Message\TenantModuleReadyEvent': tenant_ready
            'App\Application\Tenant\Message\ActivateCeoAccountEvent': activing_account_ceo
