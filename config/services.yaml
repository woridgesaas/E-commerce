# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    mailer_from: '%env(MAILER_FROM)%'
    strapi.base_url: '%env(STRAPI_BASE_URL)%'


imports:
    - { resource: '_infrastructure/database_servers.yaml' }
services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Kernel.php'

    # Listener d'exception global
    App\UI\Web\Exception\GlobalExceptionListener:
        tags:
            - { name: kernel.event_listener, event: kernel.exception }

    App\UI\Api\Internal\Tenant\Exception\ApiExceptionListener:
        tags:
            - { name: kernel.event_listener, event: kernel.exception }

    App\Application\EventListener\TenantModuleReadyEventListener:
        tags:
            - { name: kernel.event_listener , event: App\Application\Provisioning\Message\TenantModuleReadyEvent }

    # Binding explicite de l'interface vers l'implémentation
    App\Application\User\Port\PasswordHasherInterface:
        class: App\Infrastructure\Security\SymfonyPasswordHasher

    App\Domain\User\Repository\UserRepositoryInterface:
        class: App\Infrastructure\Persistence\Doctrine\Repository\DoctrineUserRepository

    App\Domain\Tenant\Repository\TenantRepositoryInterface: '@App\Infrastructure\Persistence\Redis\Repository\CachedTenantRepository'

    App\Infrastructure\Persistence\Redis\Repository\CachedTenantRepository:
        arguments:
            $tenantRepository: '@App\Infrastructure\Persistence\Doctrine\Repository\DoctrineTenantRepository'

    App\Infrastructure\Security\InternalApiKeyAuthenticator:
        arguments:
            $internalSecret: '%env(INTERNAL_SECRET)%'

    App\Domain\Product\Repository\ProductRepositoryInterface:
        class: App\Infrastructure\Persistence\Doctrine\Repository\DoctrineProductRepository

    App\Infrastructure\Service\FileUploader:
        arguments:
            $uploadDir: '%kernel.project_dir%/public/uploads/products'

    App\Application\Shared\Port\FileUploaderInterface:
        alias: App\Infrastructure\Service\FileUploader

    App\Application\User\Port\MailerPort:
        class: App\Infrastructure\Service\SymfonyMailerAdapter
        arguments:
           $fromEmail: '%mailer_from%'
           $baseDomain: '%env(BASE_DOMAIN)%'

    App\Infrastructure\Service\StrapiService:
        arguments:
            $baseUrl: '%strapi.base_url%'

    App\Domain\Subscription\Repository\SubscriptionRepositoryInterface:
       class: App\Infrastructure\Persistence\Doctrine\Repository\DoctrineSubscriptionRepository



    App\Application\Provisioning\Command\ProvisioningCommandHandler:
        arguments:
            $subscriptionRepository: '@App\Infrastructure\Persistence\Doctrine\Repository\DoctrineTenantRepository'

    App\Application\Tenant\Service\WelcomeTenantService:
        arguments:
            $tenantRepository: '@App\Infrastructure\Persistence\Doctrine\Repository\DoctrineTenantRepository'

    App\Infrastructure\Provisioning\Strategy\SqlserverProvisioner:
        tags: ['app.database_provisioner']
    App\Infrastructure\Provisioning\Strategy\PostgreSqlProvisioner:
        tags: ['app.database_provisioner']

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
